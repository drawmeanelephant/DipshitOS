# Ragshit configuration for this repository.
# Generated by `ragshit init`. All keys are optional; absent keys use the
# defaults below. See docs/configuration.md for details.

[index]
database = ".ragshit/index.sqlite3"
include_untracked = false
max_file_bytes = 1048576
follow_symlinks = false

[retrieval]
default_limit = 20
maximum_limit = 100
changed_file_boost = 2.0
path_match_boost = 4.0
symbol_match_boost = 5.0
heading_match_boost = 3.0

[bundle]
maximum_characters = 120000
include_git_status = true
include_recent_commits = true
recent_commit_count = 10
include_diff = true

[embeddings]
enabled = false
provider = "disabled"
