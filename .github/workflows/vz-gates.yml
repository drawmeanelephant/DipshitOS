# vz-gates.yml -- class-B VZ hardware-gate placeholder (NOT enforcement).
#
# There is no Apple-silicon runner (VZ_RUNNER_LABEL unset; GitHub-hosted
# runners cannot boot VZ — Hypervisor.framework is unavailable on them),
# so the old four-shard fleet machinery never ran a gate here: every shard
# skipped in seconds and the aggregate printed NOT ENFORCED. The shards
# were removed 2026-09; this single job keeps the `VZ hardware gates`
# required check (ruleset "VZ hardware gates (bypassable, PR merges
# only)") reporting instead of stuck on "expected". It proves nothing
# about guest behavior — run `just verify-vz` on Apple silicon for that.
#
# If a runner is ever registered per docs/vz-runner.md, restore sharded
# runs of the discovered fleet (`bash tools/gate/fleet.sh list`) on it;
# the removed machinery lives in git history before this stub.

name: VZ hardware gates

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  summary:
    name: VZ hardware gates
    # Mac-only project, macOS 27 only: even the placeholder runs on the
    # macOS 27 image (same label as the Swift-spike job in ci.yml), never
    # Ubuntu.
    runs-on: xcode-27
    steps:
      - name: Report class-B as not enforced
        run: |
          {
            echo "### VZ hardware gates — **NOT ENFORCED**"
            echo
            echo "No Apple-silicon VZ-capable runner is registered, so no"
            echo "class-B gate ran in CI. This check passes without proving"
            echo "anything about guest behavior. Run \`just verify-vz\` on"
            echo "Apple silicon for the real fleet."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning title=VZ hardware gates NOT ENFORCED::no runner registered — class-B gates run only via just verify-vz on Apple silicon."
          echo "VZ hardware gates: NOT ENFORCED (placeholder, no runner)."
