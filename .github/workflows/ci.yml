# CI proves ONLY the portable/build gate set — class A in
# docs/gate-inventory.md: formatting, unit tests, transcript mock test,
# guest/image builds, inspect, Swift runner build, context generation, and
# the coordination gates. It does NOT run the Apple-silicon
# Virtualization.framework hardware gates (class B) — those live in the
# dedicated `vz-gates` workflow (.github/workflows/vz-gates.yml), which
# runs them on a self-hosted macOS 27+ Apple silicon runner once the
# repository variable VZ_RUNNER_LABEL names its label (until then that
# workflow reports SKIPPED honestly). GitHub-hosted runners top out at
# macOS 26 and do not prove VZ hardware behavior — a green CI badge here
# still means "the portable gates passed", nothing more. Run
# `just verify-vz` on an Apple silicon host for local VZ gate runs.
#
# One build check requires the macOS 27 SDK (the custom-virtio spike): it
# runs in a separate job on GitHub's `xcode-27` public-preview arm64 runner
# (announced 2026-07-16; macOS 26 OS with Xcode 27 / the macOS 27.0 SDK). It
# still boots no VM, so it remains class A.

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test-macos:
    name: Build (macOS + Swift Launcher)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Zig 0.16.0
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.16.0

      # --- Class A: portable/build gates (see docs/gate-inventory.md) ---

      - name: Check Zig formatting (class A)
        run: zig fmt --check boot/src/*.zig kernel/src/*.zig user/src/*.zig build.zig

      - name: Test kernel monitor modules (class A)
        run: bash tools/verify-unit-tests.sh

      - name: Test automated console transcript (class A)
        run: zig build test-console

      - name: Build UEFI application and kernel image (class A)
        run: zig build

      - name: Create FAT32+GPT boot disk image (class A)
        run: zig build image

      - name: Inspect binary and disk image (class A)
        run: zig build inspect

      - name: Build Swift Virtualization Launcher (class A — build only, does not boot)
        run: swift build --package-path host/vm-runner

      - name: Verify project context generator (class A)
        run: zig build context

      - name: Verify multiagent coordination indexes (class A)
        run: bash tools/verify-coordination.sh

      - name: Test multiagent coordination tooling (class A)
        run: bash tools/status/test-coordination.sh

      - name: Verify MMU takeover contract (class A — ADR 0006 supersession, T0SZ=16 + TLBI comments)
        run: bash tools/verify-mmu-debt.sh

      - name: Verify the glyph raster convention (class A — full-table goldens + offline mirror self-test + mutation check)
        run: bash tools/verify-glyph-raster.sh

      - name: Verify the bit-order mutation checks (class A — glyph raster + FAT endianness + virtio chain walk)
        run: bash tools/verify-mutations.sh

      - name: Verify the kernel `.bss` ceiling (class A — ADR 0013 D3.1)
        run: bash tools/verify-bss-budget.sh

      # --- Class B: Apple-silicon VZ hardware gates run in vz-gates.yml ---

      - name: State which gates this CI does NOT prove
        run: |
          echo "CI complete: portable/build gates (class A) passed."
          echo "Class-B VZ hardware gates run in the separate 'VZ hardware gates' workflow"
          echo "(skipped until VZ_RUNNER_LABEL names a registered macOS 27+ runner)."
          echo "NOT proven by THIS workflow — see also just verify-vz:"
          # The machine-readable GATE_INVENTORY block lives in
          # docs/archive/gate-inventory-detail.md (issue #265).
          sed -n '/^<!-- GATE_INVENTORY:START -->$/,/^<!-- GATE_INVENTORY:END -->$/p' docs/archive/gate-inventory-detail.md \
            | grep ' class=B ' \
            | sed -E 's/^GATE id=([^ ]+) .*cmd=(.*)$/  - \1: \2/'

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: virelaios-artifacts-macos
          path: |
            zig-out/
            artifacts/

  # The custom-virtio spike (kernel/src/monitor.zig `pci` + the runner's
  # --custom-virtio section, claim 5844) references macOS-27-only
  # Virtualization.framework types, so it compiles only against the macOS 27
  # SDK. The macos-latest job above cannot build it; this job runs on
  # GitHub's `xcode-27` public-preview image (arm64, Xcode 27 / macOS 27.0
  # SDK) and compiles the SPIKE-gated Swift code. No VM is booted.
  #
  # This job is ALSO the compile check for every macOS-27-only API in
  # VMRunner main.swift: DiskImageKit stacked overlays (--overlay-base,
  # issue #523 item 2 / claim 6637) are `#if canImport(DiskImageKit)`-
  # gated, so the macos-latest canary above skips them while THIS job
  # compiles them for real.
  build-swift-spike-macos27:
    name: Build Swift launcher + custom-virtio spike (macOS 27 SDK)
    runs-on: xcode-27

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Swift launcher with SPIKE define (class A, macOS 27 SDK)
        run: swift build --package-path host/vm-runner -Xswiftc -DSPIKE
