name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test-macos:
    name: Build (macOS + Swift Launcher)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Zig 0.16.0
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.16.0

      - name: Check Zig formatting
        run: zig fmt --check boot/src/*.zig kernel/src/*.zig build.zig

      - name: Test kernel monitor modules
        run: bash tools/verify-unit-tests.sh

      - name: Test automated console transcript
        run: zig build test-console

      - name: Build UEFI application and kernel image
        run: zig build

      - name: Create FAT32+GPT boot disk image
        run: zig build image

      - name: Inspect binary and disk image
        run: zig build inspect

      - name: Build Swift Virtualization Launcher
        run: swift build --package-path host/vm-runner

      - name: Verify project context generator
        run: zig build context

      - name: Verify multiagent coordination indexes
        run: bash tools/verify-coordination.sh

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dipshitos-artifacts-macos
          path: |
            zig-out/
            artifacts/
