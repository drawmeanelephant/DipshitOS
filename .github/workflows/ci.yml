# CI proves ONLY the portable/build gate set — class A in
# docs/gate-inventory.md. The set is defined once, as `just verify-portable`
# (justfile), and this workflow delegates to that recipe instead of
# hand-copying its steps: a copied list drifted twice (three gates silently
# local-only, issue #1186), and the parity guard that policed the drift is
# gone with the copy. `tools/lint-workflows.sh` asserts the delegation is
# present. It does NOT run the Apple-silicon
# Virtualization.framework hardware gates (class B) — those live in the
# dedicated `vz-gates` workflow (.github/workflows/vz-gates.yml), which
# runs them on a self-hosted macOS 27+ Apple silicon runner once the
# repository variable VZ_RUNNER_LABEL names its label. Until a runner is
# registered, that workflow skips every gate and SAYS SO in its run
# summary ("NOT ENFORCED: 0 of N class-B gates ran") rather than showing
# a green required check that enforced nothing.
# GitHub-hosted runners cannot run class B at any macOS version:
# Hypervisor.framework is unavailable on them (actions/runner-images#13505,
# closed as not planned), so Virtualization.framework cannot boot a guest
# there — A green CI badge here still means "the portable gates passed",
# nothing more. Run
# `just verify-vz` on an Apple silicon host for local VZ gate runs.
#
# One build check requires the macOS 27 SDK (the custom-virtio spike): it
# runs in a separate job on GitHub's `xcode-27` public-preview arm64 runner
# (announced 2026-07-16; the image has run macOS 27 itself since 2026-09-10). It
# still boots no VM, so it remains class A.

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test-macos:
    name: Build (macOS + Swift Launcher)
    runs-on: macos-latest
    # The coordination gate reads open `claim` issues from the GitHub API
    # (gh issue list); the job-level token needs issues: read for that.
    permissions:
      contents: read
      issues: read
      actions: write  # upload-artifact

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Zig 0.16.0
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.16.0

      # --- Class A: the whole portable set, via the recipe devs run -----
      # `just verify-portable` IS the class-A gate set (docs/testing.md):
      # formatting, unit tests, transcript mock test, guest/image builds,
      # inspect, Swift runner build, context generation, workflow lint,
      # and the coordination gates. One step, so CI can never drift from
      # local again. Needs GH_TOKEN: the coordination gate reads the live
      # `claim` issues via `gh`, like it does locally.

      - name: Ensure just is available
        run: command -v just >/dev/null || brew install just

      - name: Run the portable gate set (class A — just verify-portable)
        run: just verify-portable
        env:
          GH_TOKEN: ${{ github.token }}

      # --- Class B: Apple-silicon VZ hardware gates run in vz-gates.yml ---

      - name: State which gates this CI does NOT prove
        run: |
          echo "CI complete: portable/build gates (class A) passed."
          echo "Class-B VZ hardware gates run in the separate 'VZ hardware gates' workflow"
          echo "(NOT ENFORCED until VZ_RUNNER_LABEL names a registered macOS 27+ runner — docs/vz-runner.md)."
          echo "NOT proven by THIS workflow — see also just verify-vz:"
          # The class-B fleet is discovered from the spec dir (M40 GF5,
          # issue #940): tools/gate/fleet.sh list is the machine-readable
          # source the vz-gates.yml shards consume.
          bash tools/gate/fleet.sh list | awk -F'\t' '{printf "  - [%s] %s\n", $1, $2}'

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: virelaios-artifacts-macos
          path: |
            zig-out/
            artifacts/

  # The custom-virtio spike (kernel/src/monitor.zig `pci` + the runner's
  # --custom-virtio section, claim 5844) references macOS-27-only
  # Virtualization.framework types, so it compiles only against the macOS 27
  # SDK. The macos-latest job above cannot build it; this job runs on
  # GitHub's `xcode-27` public-preview image (arm64, Xcode 27 / macOS 27.0
  # SDK) and compiles the SPIKE-gated Swift code. No VM is booted.
  #
  # This job is ALSO the compile check for every macOS-27-only API in
  # VMRunner main.swift: DiskImageKit stacked overlays (--overlay-base,
  # issue #523 item 2 / claim 6637) are `#if canImport(DiskImageKit)`-
  # gated, so the macos-latest canary above skips them while THIS job
  # compiles them for real.
  build-swift-spike-macos27:
    name: Build Swift launcher + custom-virtio spike (macOS 27 SDK)
    runs-on: xcode-27

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Swift launcher with SPIKE define (class A, macOS 27 SDK)
        run: swift build --package-path host/vm-runner -Xswiftc -DSPIKE
