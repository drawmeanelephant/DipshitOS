# Merge-time coordination-index generation (claim 2599).
#
# The index tables in docs/claims/README.md and docs/logs/README.md used to
# be regenerated by every branch, which made those two shared files collide
# textually on nearly every near-simultaneous merge — the last guaranteed
# conflict class in the coordination surface. Branches no longer touch them:
# this workflow is the single serialized writer, regenerating the tables on
# main immediately after every merge so they are always in sync where sync
# is meaningful. The PR-side coordination gate
# (tools/verify-coordination.sh) validates structure only; a branch's
# committed indexes are stale by design.
#
# Concurrency is serialized (one run at a time) and pushes rebase-retry, so
# back-to-back merges cannot race the bot against itself. The bot commit is
# marked [skip ci]: a docs-only regeneration does not need to rebuild the
# guest or rerun gates.

name: Indexes

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: indexes-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    name: Regenerate coordination indexes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history: the push-retry path rebases onto freshly-pushed
          # main, which a shallow clone cannot do.
          fetch-depth: 0

      # refresh_mode regenerates both tables and then self-verifies with the
      # strict --check (structure AND sync), so a broken generator or a
      # malformed table fails loudly here on main.
      - name: Regenerate indexes
        run: bash tools/status/refresh-indexes.sh

      - name: Commit and push regenerated indexes
        run: |
          git config user.name  "indexes-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          commit_indexes() {
            git add docs/claims/README.md docs/logs/README.md
            if ! git diff --cached --quiet; then
              git commit -m "chore(indexes): regenerate coordination indexes [skip ci]"
            fi
          }

          commit_indexes

          n=0
          until git push origin HEAD:main; do
            n=$((n + 1))
            if [ "$n" -ge 3 ]; then
              echo "::error::push failed after $n attempts (rebase retries exhausted)" >&2
              exit 1
            fi
            git pull --rebase origin main
            bash tools/status/refresh-indexes.sh
            commit_indexes
          done
