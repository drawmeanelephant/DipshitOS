# Merge-time coordination-index generation (claim 2599).
#
# The index tables in docs/claims/README.md and docs/logs/README.md used to
# be regenerated by every branch, which made those two shared files collide
# textually on nearly every near-simultaneous merge — the last guaranteed
# conflict class in the coordination surface. Branches no longer touch them:
# this workflow is the single serialized writer, regenerating the tables
# shortly after every merge. The PR-side coordination gate
# (tools/verify-coordination.sh) validates structure only; a branch's
# committed indexes are stale by design.
#
# Branch protection on main requires changes to arrive as PRs (with no
# bypass, per docs/branch-protection.md), so the bot cannot push directly:
# it force-updates a single well-known branch and keeps one open
# auto-merge (squash) PR. Concurrency is serialized (one run at a time),
# so back-to-back merges cannot race the bot against itself.
#
# Requires a repository secret INDEXES_PAT (classic PAT with repo scope, or
# fine-grained with contents:write + pull-requests:write): PRs opened with
# the default GITHUB_TOKEN do not trigger the pull_request workflows that
# report the required "Build (macOS + Swift Launcher)" check, so auto-merge
# would never fire. The bot commit carries no [skip ci] for the same reason.

name: Indexes

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: indexes-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    name: Regenerate coordination indexes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # refresh_mode regenerates both tables and then self-verifies with the
      # strict --check (structure AND sync), so a broken generator or a
      # malformed table fails loudly here.
      - name: Regenerate indexes
        run: bash tools/status/refresh-indexes.sh

      - name: Open or update the regeneration PR
        env:
          GH_TOKEN: ${{ secrets.INDEXES_PAT }}
          BRANCH: indexes/bot-regenerate
        run: |
          git config user.name  "indexes-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main "$BRANCH" 2>/dev/null || git fetch origin main

          # Always rebuild from main's exact tree and regenerate, so the PR
          # content is provably "main + freshly generated tables" — stale
          # bot history is discarded rather than merged.
          git checkout -B "$BRANCH" origin/main
          bash tools/status/refresh-indexes.sh

          if git diff --quiet -- docs/claims/README.md docs/logs/README.md; then
            echo "tables already in sync on main — nothing to do"
            exit 0
          fi

          git add docs/claims/README.md docs/logs/README.md
          git commit -m "chore(indexes): regenerate coordination indexes"
          git push --force-with-lease=refs/heads/"$BRANCH":refs/heads/"$BRANCH" \
            origin HEAD:"$BRANCH" \
            || git push origin HEAD:"$BRANCH"

          TITLE="chore(indexes): regenerate coordination indexes"
          BODY="Automated regeneration of the claim/log index tables by .github/workflows/indexes.yml (claim 2599). Merging this PR is the only way index tables ever change on main."

          if gh pr view "$BRANCH" --json state --jq .state >/dev/null 2>&1; then
            gh pr edit "$BRANCH" --title "$TITLE" --body "$BODY" >/dev/null
          else
            gh pr create --base main --head "$BRANCH" \
              --title "$TITLE" --body "$BODY" >/dev/null
          fi

          # Auto-merge needs "Allow auto-merge" enabled in repo settings;
          # if it is off, the PR still exists and merges manually.
          gh pr merge "$BRANCH" --auto --squash >/dev/null 2>&1 \
            || echo "::warning::could not set auto-merge (enable 'Allow auto-merge' in Settings > General > Pull Requests, or merge $BRANCH manually)"
